<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Safety Threats in Front-End Development thumbnail">
  <defs>
    <linearGradient id="safetyBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0d12"/>
      <stop offset="1" stop-color="#1c1d2b"/>
    </linearGradient>
    <linearGradient id="safetyShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b78f6"/>
      <stop offset="1" stop-color="#3b58da"/>
    </linearGradient>
    <pattern id="safetyDots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#5b78f6" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#safetyBg)"/>
  <rect width="1200" height="675" fill="url(#safetyDots)"/>

  <!-- diagonal warning stripes, very subtle -->
  <g opacity="0.06" fill="#ffb648">
    <rect x="-200" y="600" width="1700" height="14" transform="rotate(-12 600 600)"/>
    <rect x="-200" y="640" width="1700" height="14" transform="rotate(-12 600 600)"/>
  </g>

  <!-- code marks suggesting the front-end context -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" fill="#5b78f6" fill-opacity="0.35">
    <text x="80"   y="120" font-size="40">&lt;/&gt;</text>
    <text x="1020" y="140" font-size="40">{ }</text>
    <text x="1040" y="600" font-size="40">&lt;/&gt;</text>
    <text x="100"  y="600" font-size="40">{ }</text>
  </g>

  <!-- shield -->
  <g transform="translate(600 337)">
    <path d="M0,-180
             L130,-130
             L130,30
             C130,110 70,170 0,200
             C-70,170 -130,110 -130,30
             L-130,-130 Z"
          fill="url(#safetyShield)"
          stroke="#7c93ff"
          stroke-width="2"/>
    <!-- inner highlight -->
    <path d="M0,-150
             L100,-110
             L100,20
             C100,80 55,130 0,155
             C-55,130 -100,80 -100,20
             L-100,-110 Z"
          fill="none"
          stroke="#ffffff"
          stroke-opacity="0.12"
          stroke-width="1.5"/>
    <!-- check inside shield -->
    <path d="M-46,8 L-12,42 L52,-32"
          fill="none"
          stroke="#ffffff"
          stroke-width="14"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- subtle title bar at the bottom-left, just enough to anchor identity -->
  <g font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" fill="#f6f1ea">
    <text x="80" y="535" font-size="22" letter-spacing="6" fill-opacity="0.55">FRONT-END · SECURITY</text>
    <text x="80" y="582" font-size="44" font-weight="600">Safety Threats &amp; Mitigation</text>
  </g>
</svg>
