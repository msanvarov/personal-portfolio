    <!--
      Google Sans Text + Google Sans Display: Google's own typeface family,
      released to Google Fonts. We load Text for body copy and Display for
      large headings; the stack falls back to Lato → system sans if either
      family fails to load.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:ital,wght@0,400;0,500;0,700;1,400&family=Google+Sans+Display:wght@400;500;700&display=swap"

    <!--
      Site-level structured data: rendered statically so non-JS-rendering
      crawlers (GPTBot, ClaudeBot, Perplexity, etc.) get a Person + WebSite
      signal on the first byte without waiting for client-side hydration.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://www.sal-anvarov.com/#sal",
            "name": "Sal Anvarov",
            "alternateName": "Salimjon Anvarov",
            "url": "https://www.sal-anvarov.com/",
            "image": "https://www.sal-anvarov.com/assets/3d-headshot.png",
            "jobTitle": "Full Stack Developer & Co-founder",
            "sameAs": [
              "https://github.com/msanvarov",
              "https://linkedin.com/in/sal-anvarov",
              "https://cleanlist.ai"
            ],
            "knowsAbout": [
              "TypeScript",
              "React",
              "Next.js",
              "Node.js",
              "NestJS",
              "AWS",
              "GCP",
              "AI engineering",
              "Full stack web development"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://www.sal-anvarov.com/#site",
            "name": "Sal Anvarov",
            "url": "https://www.sal-anvarov.com/",
            "inLanguage": "en",
            "author": { "@id": "https://www.sal-anvarov.com/#sal" },
            "publisher": { "@id": "https://www.sal-anvarov.com/#sal" }
          }
        ]
      }
    </script>
