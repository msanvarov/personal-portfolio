<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Pack your references: Seedance on Higgsfield thumbnail">
  <defs>
    <linearGradient id="sdBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0d12"/>
      <stop offset="1" stop-color="#1c1d2b"/>
    </linearGradient>
    <pattern id="sdDots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#5b78f6" fill-opacity="0.08"/>
    </pattern>
    <linearGradient id="sdFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b78f6"/>
      <stop offset="1" stop-color="#3b58da"/>
    </linearGradient>
    <clipPath id="sdPanel"><rect width="104" height="104" rx="12"/></clipPath>
  </defs>

  <rect width="1200" height="675" fill="url(#sdBg)"/>
  <rect width="1200" height="675" fill="url(#sdDots)"/>

  <!-- annotations -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18" fill="#5b78f6" fill-opacity="0.5">
    <text x="80" y="110">@character = one sheet</text>
    <text x="80" y="140">@product   = one sheet</text>
    <text x="80" y="170">same light · plain bg · no text</text>
  </g>

  <!-- reference sheet: 3 x 2 panels of one subject from different angles -->
  <g transform="translate(470 92)">
    <rect x="-20" y="-20" width="392" height="272" rx="22" fill="#15161f" stroke="#2a2d44" stroke-width="2"/>
    <g fill="#9aa9ff" fill-opacity="0.85">
      <!-- front -->
      <g transform="translate(0 0)">
        <rect width="104" height="104" rx="12" fill="#ecebef" fill-opacity="0.08" stroke="#2f3350"/>
        <g clip-path="url(#sdPanel)"><circle cx="52" cy="40" r="17"/><path d="M18,104 C20,74 36,64 52,64 C68,64 84,74 86,104 Z"/></g>
      </g>
      <!-- three-quarter -->
      <g transform="translate(124 0)">
        <rect width="104" height="104" rx="12" fill="#ecebef" fill-opacity="0.08" stroke="#2f3350"/>
        <g clip-path="url(#sdPanel)"><ellipse cx="56" cy="40" rx="15" ry="17"/><path d="M24,104 C28,74 42,64 56,64 C70,64 82,74 84,104 Z"/></g>
      </g>
      <!-- profile -->
      <g transform="translate(248 0)">
        <rect width="104" height="104" rx="12" fill="#ecebef" fill-opacity="0.08" stroke="#2f3350"/>
        <g clip-path="url(#sdPanel)"><path d="M48,23 C64,23 70,34 69,44 L74,48 L68,50 C66,60 58,58 50,58 C40,58 35,50 35,40 C35,30 40,23 48,23 Z"/><path d="M30,104 C32,76 42,64 54,64 C66,64 76,76 76,104 Z"/></g>
      </g>
      <!-- back -->
      <g transform="translate(0 128)">
        <rect width="104" height="104" rx="12" fill="#ecebef" fill-opacity="0.08" stroke="#2f3350"/>
        <g clip-path="url(#sdPanel)" fill-opacity="0.6"><circle cx="52" cy="40" r="17"/><path d="M18,104 C20,74 36,64 52,64 C68,64 84,74 86,104 Z"/></g>
      </g>
      <!-- face close-up -->
      <g transform="translate(124 128)">
        <rect width="104" height="104" rx="12" fill="#ecebef" fill-opacity="0.08" stroke="#2f3350"/>
        <g clip-path="url(#sdPanel)"><circle cx="52" cy="58" r="34"/><circle cx="41" cy="54" r="3.5" fill="#15161f"/><circle cx="63" cy="54" r="3.5" fill="#15161f"/></g>
      </g>
      <!-- detail: jacket close-up with a logo badge -->
      <g transform="translate(248 128)">
        <rect width="104" height="104" rx="12" fill="#ecebef" fill-opacity="0.08" stroke="#2f3350"/>
        <g clip-path="url(#sdPanel)"><path d="M-6,104 C0,40 24,18 52,18 C80,18 104,40 110,104 Z"/><path d="M52,18 L44,58 L52,52 L60,58 Z" fill="#15161f" fill-opacity="0.35"/></g>
        <rect x="64" y="58" width="16" height="16" rx="4" fill="#ffb648" fill-opacity="0.9"/>
      </g>
    </g>
  </g>

  <!-- arrow: one sheet in -->
  <g fill="none" stroke="#5b78f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85">
    <path d="M870,208 L930,208"/>
    <path d="M920,198 L932,208 L920,218"/>
  </g>
  <text x="900" y="190" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#9aa9ff" fill-opacity="0.7">1 slot</text>

  <!-- video frame out -->
  <g transform="translate(950 120)">
    <rect width="190" height="176" rx="16" fill="url(#sdFrame)"/>
    <g fill="#ffffff" fill-opacity="0.18">
      <rect x="10" y="8" width="14" height="10" rx="2"/><rect x="34" y="8" width="14" height="10" rx="2"/><rect x="58" y="8" width="14" height="10" rx="2"/><rect x="82" y="8" width="14" height="10" rx="2"/><rect x="106" y="8" width="14" height="10" rx="2"/><rect x="130" y="8" width="14" height="10" rx="2"/><rect x="154" y="8" width="14" height="10" rx="2"/>
      <rect x="10" y="158" width="14" height="10" rx="2"/><rect x="34" y="158" width="14" height="10" rx="2"/><rect x="58" y="158" width="14" height="10" rx="2"/><rect x="82" y="158" width="14" height="10" rx="2"/><rect x="106" y="158" width="14" height="10" rx="2"/><rect x="130" y="158" width="14" height="10" rx="2"/><rect x="154" y="158" width="14" height="10" rx="2"/>
    </g>
    <path d="M80,62 L80,114 L122,88 Z" fill="#ffffff"/>
  </g>
  <text x="1045" y="326" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#9aa9ff" fill-opacity="0.7">consistent shot</text>

  <!-- title -->
  <g font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" fill="#f6f1ea">
    <text x="80" y="535" font-size="22" letter-spacing="6" fill-opacity="0.55">GENERATIVE AI · VIDEO</text>
    <text x="80" y="582" font-size="44" font-weight="600">Pack Your References for AI Video</text>
  </g>
</svg>
