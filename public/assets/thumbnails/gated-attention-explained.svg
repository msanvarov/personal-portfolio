<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Gated Attention, Explained thumbnail">
  <defs>
    <linearGradient id="gatedAttnBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0d12"/>
      <stop offset="1" stop-color="#1c1d2b"/>
    </linearGradient>
    <linearGradient id="gatedAttnBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f88ff"/>
      <stop offset="1" stop-color="#3b58da"/>
    </linearGradient>
    <linearGradient id="gatedAttnGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb648" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffb648" stop-opacity="0.06"/>
    </linearGradient>
    <pattern id="gatedAttnDots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#5b78f6" fill-opacity="0.08"/>
    </pattern>
    <marker id="gatedAttnArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9aa9ff"/>
    </marker>
    <marker id="gatedAttnArrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ffb648"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#gatedAttnBg)"/>
  <rect width="1200" height="675" fill="url(#gatedAttnDots)"/>

  <!-- the whole change, top-left -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" fill="#5b78f6" fill-opacity="0.5">
    <text x="80" y="120">// G1: post-SDPA gate</text>
    <text x="80" y="160">G   = σ(X W_θ)</text>
    <text x="80" y="192">out = W_O(SDPA(Q,K,V) ⊙ G)</text>
    <text x="80" y="248">// non-linearity</text>
    <text x="80" y="280">// sparsity</text>
    <text x="80" y="312">// no attention sink</text>
  </g>

  <!-- diagram -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" fill="#f6f1ea">
    <!-- wires X -> Q K V -->
    <g fill="none" stroke="#9aa9ff" stroke-opacity="0.55" stroke-width="2.5">
      <path d="M612,265 C636,265 636,155 658,155" marker-end="url(#gatedAttnArrow)"/>
      <path d="M612,265 C636,265 636,225 658,225" marker-end="url(#gatedAttnArrow)"/>
      <path d="M612,265 C636,265 636,295 658,295" marker-end="url(#gatedAttnArrow)"/>
      <line x1="724" y1="155" x2="768" y2="155" marker-end="url(#gatedAttnArrow)"/>
      <line x1="724" y1="225" x2="768" y2="225" marker-end="url(#gatedAttnArrow)"/>
      <line x1="724" y1="295" x2="768" y2="295" marker-end="url(#gatedAttnArrow)"/>
      <line x1="900" y1="225" x2="932" y2="225" marker-end="url(#gatedAttnArrow)"/>
      <line x1="986" y1="225" x2="1008" y2="225" marker-end="url(#gatedAttnArrow)"/>
      <line x1="1088" y1="225" x2="1128" y2="225" marker-end="url(#gatedAttnArrow)"/>
    </g>
    <!-- gate branch -->
    <g fill="none" stroke="#ffb648" stroke-opacity="0.8" stroke-width="2.5">
      <path d="M576,295 V400 H658" marker-end="url(#gatedAttnArrowAmber)"/>
      <path d="M830,400 H960 V253" marker-end="url(#gatedAttnArrowAmber)"/>
    </g>

    <!-- X -->
    <rect x="540" y="235" width="72" height="60" rx="10" fill="#15161f" stroke="#2a2d44" stroke-width="2"/>
    <text x="576" y="273" font-size="22" text-anchor="middle">X</text>

    <!-- Q K V -->
    <g font-size="20" text-anchor="middle">
      <rect x="660" y="132" width="64" height="46" rx="8" fill="#15161f" stroke="#2a2d44" stroke-width="2"/>
      <text x="692" y="162">Q</text>
      <rect x="660" y="202" width="64" height="46" rx="8" fill="#15161f" stroke="#2a2d44" stroke-width="2"/>
      <text x="692" y="232">K</text>
      <rect x="660" y="272" width="64" height="46" rx="8" fill="#15161f" stroke="#2a2d44" stroke-width="2"/>
      <text x="692" y="302">V</text>
    </g>

    <!-- SDPA with causal attention map -->
    <rect x="770" y="120" width="130" height="210" rx="12" fill="#15161f" stroke="#2a2d44" stroke-width="2"/>
    <g fill="#5b78f6">
      <rect x="795" y="148" width="14" height="14" rx="2" fill-opacity="0.9"/>
      <rect x="795" y="166" width="14" height="14" rx="2" fill-opacity="0.5"/>
      <rect x="813" y="166" width="14" height="14" rx="2" fill-opacity="0.7"/>
      <rect x="795" y="184" width="14" height="14" rx="2" fill-opacity="0.3"/>
      <rect x="813" y="184" width="14" height="14" rx="2" fill-opacity="0.45"/>
      <rect x="831" y="184" width="14" height="14" rx="2" fill-opacity="0.6"/>
      <rect x="795" y="202" width="14" height="14" rx="2" fill-opacity="0.25"/>
      <rect x="813" y="202" width="14" height="14" rx="2" fill-opacity="0.35"/>
      <rect x="831" y="202" width="14" height="14" rx="2" fill-opacity="0.3"/>
      <rect x="849" y="202" width="14" height="14" rx="2" fill-opacity="0.55"/>
      <rect x="795" y="220" width="14" height="14" rx="2" fill-opacity="0.2"/>
      <rect x="813" y="220" width="14" height="14" rx="2" fill-opacity="0.3"/>
      <rect x="831" y="220" width="14" height="14" rx="2" fill-opacity="0.25"/>
      <rect x="849" y="220" width="14" height="14" rx="2" fill-opacity="0.35"/>
      <rect x="867" y="220" width="14" height="14" rx="2" fill-opacity="0.5"/>
    </g>
    <text x="835" y="290" font-size="20" text-anchor="middle" fill="#9aa9ff">SDPA</text>

    <!-- elementwise multiply -->
    <circle cx="960" cy="225" r="26" fill="url(#gatedAttnBox)" stroke="#9aa9ff" stroke-width="2"/>
    <text x="960" y="234" font-size="28" text-anchor="middle" fill="#ffffff">⊙</text>

    <!-- W_O -->
    <rect x="1010" y="197" width="78" height="56" rx="10" fill="#15161f" stroke="#2a2d44" stroke-width="2"/>
    <text x="1049" y="232" font-size="20" text-anchor="middle">W_O</text>
    <text x="1108" y="208" font-size="15" text-anchor="middle" fill-opacity="0.55">out</text>

    <!-- sigmoid gate -->
    <rect x="660" y="372" width="170" height="56" rx="10" fill="url(#gatedAttnGlow)" stroke="#ffb648" stroke-opacity="0.6" stroke-width="2"/>
    <text x="745" y="407" font-size="20" text-anchor="middle" fill="#ffb648">σ(X W_θ)</text>
    <text x="978" y="330" font-size="20" fill="#ffb648">G</text>

    <!-- per-channel gate values: some fully closed -->
    <g fill="#ffb648">
      <rect x="660" y="448" width="18" height="18" rx="3" fill-opacity="0.85"/>
      <rect x="682" y="448" width="18" height="18" rx="3" fill-opacity="0.6"/>
      <rect x="704" y="448" width="18" height="18" rx="3" fill-opacity="0.04" stroke="#ffb648" stroke-opacity="0.35"/>
      <rect x="726" y="448" width="18" height="18" rx="3" fill-opacity="0.9"/>
      <rect x="748" y="448" width="18" height="18" rx="3" fill-opacity="0.45"/>
      <rect x="770" y="448" width="18" height="18" rx="3" fill-opacity="0.04" stroke="#ffb648" stroke-opacity="0.35"/>
      <rect x="792" y="448" width="18" height="18" rx="3" fill-opacity="0.7"/>
      <rect x="814" y="448" width="18" height="18" rx="3" fill-opacity="0.3"/>
    </g>
    <text x="848" y="463" font-size="14" fill-opacity="0.5">some channels → 0</text>
  </g>

  <!-- title -->
  <g font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" fill="#f6f1ea">
    <text x="80" y="535" font-size="22" letter-spacing="6" fill-opacity="0.55">MACHINE LEARNING · PAPER</text>
    <text x="80" y="582" font-size="44" font-weight="600">Gated Attention, Explained</text>
  </g>
</svg>
