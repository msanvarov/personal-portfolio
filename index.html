<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050506" />
    <script>
      // JS is on: hide the static prerendered markup (for crawlers) while
      // React renders the app over it.
      document.documentElement.classList.add('js');
      // Apply the saved theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light') document.documentElement.classList.add('dark');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>

    <style>
      .js #root > .prerender { display: none; }
      .prerender { max-width: 46rem; margin: 0 auto; padding: 1.5rem; font: 16px/1.65 -apple-system, BlinkMacSystemFont, Inter, sans-serif; }
    </style>
    <link rel="alternate" type="application/rss+xml" title="Sal Anvarov — Blog" href="/rss.xml" />
    <link rel="alternate" type="text/plain" title="LLM guide" href="/llms.txt" />
    <title>Sal Anvarov - Personal Portfolio</title>
    <meta name="title" content="Sal Anvarov" />
    <meta
      name="description"
      content="Hard-working developer with a flair for creating elegant solutions to complex problems. Team player with a can-do attitude and a strong focus on client satisfaction. Diverse experience with modern technologies and cloud providers like AWS and GCP with enterprise DevOps experience. Likes to contribute to open-source and create apps on his free time."
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.sal-anvarov.com/" />
    <meta property="og:title" content="Sal Anvarov" />
    <meta
      property="og:description"
      content="Hard-working developer with a flair for creating elegant solutions to complex problems."
    />
    <meta
      property="og:image"
      content="https://www.sal-anvarov.com/assets/3d-headshot.png"
    />

    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.sal-anvarov.com/" />
    <meta property="twitter:title" content="Sal Anvarov" />
    <meta
      property="twitter:description"

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Typography aligned with the DevBySal brand: Inter for body, Space
      Grotesk for display headings, Instrument Serif for editorial italic
      accents, JetBrains Mono for code. All loaded from Google Fonts with
      font-display: swap so text paints before the webfont arrives.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/iconoir/6.9.0/css/iconoir.min.css"
    />

    <!--
      Site-level structured data: rendered statically so non-JS-rendering
      crawlers (GPTBot, ClaudeBot, Perplexity, etc.) get a Person + WebSite
      signal on the first byte without waiting for client-side hydration.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://www.sal-anvarov.com/#sal",
            "name": "Sal Anvarov",
            "alternateName": "Salimjon Anvarov",
            "url": "https://www.sal-anvarov.com/",
            "image": "https://www.sal-anvarov.com/assets/3d-headshot.png",
            "jobTitle": "Full Stack Developer & Co-founder",
            "sameAs": [
              "https://github.com/msanvarov",
              "https://linkedin.com/in/sal-anvarov",
              "https://cleanlist.ai"
            ],
            "knowsAbout": [
              "TypeScript",
              "React",
              "Next.js",
              "Node.js",
              "NestJS",
              "AWS",
              "GCP",
              "AI engineering",
              "Full stack web development"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://www.sal-anvarov.com/#site",
            "name": "Sal Anvarov",
            "url": "https://www.sal-anvarov.com/",
            "inLanguage": "en",
            "author": { "@id": "https://www.sal-anvarov.com/#sal" },
            "publisher": { "@id": "https://www.sal-anvarov.com/#sal" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
