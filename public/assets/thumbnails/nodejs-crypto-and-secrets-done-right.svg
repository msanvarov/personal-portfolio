<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Node.js Crypto and Secrets, Done Right thumbnail">
  <defs>
    <linearGradient id="ncsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0d12"/>
      <stop offset="1" stop-color="#1c1d2b"/>
    </linearGradient>
    <linearGradient id="ncsLock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f88ff"/>
      <stop offset="1" stop-color="#3b58da"/>
    </linearGradient>
    <linearGradient id="ncsFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b78f6" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#5b78f6" stop-opacity="0.6"/>
    </linearGradient>
    <pattern id="ncsDots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#5b78f6" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#ncsBg)"/>
  <rect width="1200" height="675" fill="url(#ncsDots)"/>

  <!-- pipeline: input -> scrypt -> hash -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace">
    <rect x="80" y="110" width="210" height="56" rx="10" fill="#15161f" stroke="#2a2d44" stroke-width="2"/>
    <text x="185" y="145" text-anchor="middle" font-size="19" fill="#f6f1ea" fill-opacity="0.7">"hunter2"</text>

    <rect x="80" y="196" width="210" height="56" rx="10" fill="#15161f" stroke="#2a2d44" stroke-width="2"/>
    <text x="185" y="231" text-anchor="middle" font-size="19" fill="#f6f1ea" fill-opacity="0.7">salt (16 B)</text>

    <path d="M290,138 C330,138 330,181 368,181 M290,224 C330,224 330,181 368,181" fill="none" stroke="url(#ncsFlow)" stroke-width="3"/>

    <rect x="370" y="146" width="170" height="70" rx="12" fill="#5b78f6" fill-opacity="0.14" stroke="#5b78f6" stroke-width="2"/>
    <text x="455" y="178" text-anchor="middle" font-size="22" font-weight="700" fill="#9aa9ff">scrypt</text>
    <text x="455" y="202" text-anchor="middle" font-size="14" fill="#9aa9ff" fill-opacity="0.75">N=2^15 r=8</text>

    <line x1="540" y1="181" x2="600" y2="181" stroke="#5b78f6" stroke-opacity="0.6" stroke-width="3"/>
    <path d="M600,173 L614,181 L600,189 Z" fill="#5b78f6" fill-opacity="0.8"/>

    <!-- other primitives -->
    <g font-size="18" fill="#5b78f6" fill-opacity="0.45">
      <text x="80" y="318">// randomBytes(32)</text>
      <text x="80" y="350">// timingSafeEqual</text>
      <text x="80" y="382">// alg: 'HS256' only</text>
      <text x="80" y="414">// aes-256-gcm</text>
    </g>

    <!-- forged JWT rejected -->
    <rect x="420" y="296" width="250" height="40" rx="6" fill="#ffb648" fill-opacity="0.1"/>
    <rect x="420" y="296" width="4" height="40" fill="#ffb648"/>
    <text x="440" y="322" font-size="17" fill="#ffb648">{"alg":"none"}</text>
    <line x1="440" y1="317" x2="580" y2="317" stroke="#ffb648" stroke-width="2.5"/>
    <text x="594" y="322" font-size="13" font-weight="700" letter-spacing="2" fill="#ffb648">REJECT</text>
  </g>

  <!-- padlock with keyhole -->
  <g transform="translate(860 120)">
    <path d="M60,150 V95 A90,90 0 0 1 240,95 V150" fill="none" stroke="#9aa9ff" stroke-opacity="0.85" stroke-width="26" stroke-linecap="round"/>
    <rect x="20" y="145" width="260" height="220" rx="28" fill="url(#ncsLock)" stroke="#9aa9ff" stroke-width="2"/>
    <circle cx="150" cy="235" r="24" fill="#0e0d12"/>
    <path d="M139,250 L161,250 L156,300 L144,300 Z" fill="#0e0d12"/>
    <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#f6f1ea" fill-opacity="0.55" text-anchor="middle">
      <text x="150" y="338">iv | tag | ciphertext</text>
    </g>
  </g>

  <!-- hashed output feeding into lock -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#f6f1ea" fill-opacity="0.45">
    <text x="624" y="186">scrypt$32768$8…</text>
  </g>

  <!-- title -->
  <g font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" fill="#f6f1ea">
    <text x="80" y="535" font-size="22" letter-spacing="6" fill-opacity="0.55">NODE.JS · SECURITY</text>
    <text x="80" y="582" font-size="44" font-weight="600">Crypto &amp; Secrets, Done Right</text>
  </g>
</svg>
