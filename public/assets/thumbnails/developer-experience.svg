<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Developer Experience — Beyond the Notion of Comfort thumbnail">
  <defs>
    <linearGradient id="dxBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0d12"/>
      <stop offset="1" stop-color="#1a1a2a"/>
    </linearGradient>
    <linearGradient id="dxAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b78f6"/>
      <stop offset="1" stop-color="#9aa9ff"/>
    </linearGradient>
    <pattern id="dxDots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#5b78f6" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#dxBg)"/>
  <rect width="1200" height="675" fill="url(#dxDots)"/>

  <!-- editor window -->
  <g transform="translate(220 130)">
    <!-- window shell -->
    <rect width="760" height="320" rx="16" ry="16" fill="#15151e" stroke="#2a2a3d" stroke-width="1"/>
    <!-- titlebar -->
    <rect width="760" height="44" rx="16" ry="16" fill="#1c1c2a"/>
    <rect y="22" width="760" height="22" fill="#1c1c2a"/>
    <!-- traffic lights -->
    <circle cx="26" cy="22" r="6.5" fill="#ff6058"/>
    <circle cx="50" cy="22" r="6.5" fill="#ffbe2e"/>
    <circle cx="74" cy="22" r="6.5" fill="#27c83f"/>
    <!-- filename tab -->
    <rect x="120" y="10" width="170" height="24" rx="6" ry="6" fill="#0e0d12"/>
    <text x="135" y="27" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#9aa9ff">devex.tsx</text>

    <!-- gutter -->
    <rect x="0" y="44" width="50" height="276" fill="#13131c"/>
    <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#3a3d52" text-anchor="middle">
      <text x="26" y="78">1</text>
      <text x="26" y="106">2</text>
      <text x="26" y="134">3</text>
      <text x="26" y="162">4</text>
      <text x="26" y="190">5</text>
      <text x="26" y="218">6</text>
      <text x="26" y="246">7</text>
      <text x="26" y="274">8</text>
      <text x="26" y="302">9</text>
    </g>

    <!-- "code" lines as colored rects -->
    <g>
      <!-- line 1: import -->
      <rect x="70"  y="68"  width="50"  height="12" rx="3" fill="#c197ff" opacity="0.9"/>
      <rect x="128" y="68"  width="90"  height="12" rx="3" fill="#7bd2ff" opacity="0.9"/>
      <rect x="226" y="68"  width="140" height="12" rx="3" fill="#888fae" opacity="0.65"/>
      <!-- line 2 -->
      <rect x="70"  y="96"  width="80"  height="12" rx="3" fill="#5b78f6" opacity="0.85"/>
      <rect x="158" y="96"  width="60"  height="12" rx="3" fill="#888fae" opacity="0.65"/>
      <rect x="226" y="96"  width="200" height="12" rx="3" fill="#7bd2ff" opacity="0.9"/>
      <!-- line 3 (blank) -->
      <!-- line 4 -->
      <rect x="100" y="152" width="60"  height="12" rx="3" fill="#c197ff" opacity="0.9"/>
      <rect x="168" y="152" width="120" height="12" rx="3" fill="#9bea8a" opacity="0.85"/>
      <rect x="296" y="152" width="40"  height="12" rx="3" fill="#888fae" opacity="0.5"/>
      <!-- line 5 -->
      <rect x="100" y="180" width="180" height="12" rx="3" fill="#7bd2ff" opacity="0.85"/>
      <rect x="288" y="180" width="80"  height="12" rx="3" fill="#ffd479" opacity="0.85"/>
      <!-- line 6 -->
      <rect x="100" y="208" width="80"  height="12" rx="3" fill="#5b78f6" opacity="0.85"/>
      <rect x="188" y="208" width="240" height="12" rx="3" fill="#888fae" opacity="0.55"/>
      <!-- line 7 -->
      <rect x="70"  y="236" width="40"  height="12" rx="3" fill="#c197ff" opacity="0.85"/>
      <!-- line 8 cursor -->
      <rect x="70"  y="264" width="180" height="12" rx="3" fill="#9bea8a" opacity="0.85"/>
      <rect x="258" y="262" width="2"   height="16" fill="#f6f1ea">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- floating "comfort" sticker, struck through -->
  <g transform="translate(880 160) rotate(8)">
    <rect x="0" y="0" width="190" height="60" rx="30" ry="30" fill="#5b78f6" fill-opacity="0.18" stroke="#5b78f6" stroke-width="1.5"/>
    <text x="95" y="38" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="22" font-weight="600" fill="#9aa9ff" text-anchor="middle">comfort</text>
    <line x1="22" y1="30" x2="168" y2="30" stroke="#ff6058" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- title -->
  <g font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" fill="#f6f1ea">
    <text x="80" y="535" font-size="22" letter-spacing="6" fill-opacity="0.55">DEVELOPER EXPERIENCE</text>
    <text x="80" y="582" font-size="44" font-weight="600">Beyond the Notion of Comfort</text>
  </g>
</svg>
